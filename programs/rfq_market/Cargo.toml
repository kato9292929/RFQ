[package]
name = "rfq_market"
version = "0.1.0"
description = "Buyer-initiated RFQ market for agents (Solana devnet)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rfq_market"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
